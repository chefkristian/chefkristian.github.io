<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stage City Apps</title>
<style>
  :root { color-scheme: light dark; --bg:#fafafa; --fg:#1a1a1a; --muted:#6b6b6b; --accent:#1f7a70; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1414; --fg:#eaeaea; --muted:#9a9a9a; --accent:#6fd8cd; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.6; }
  .wrap { max-width:680px; margin:0 auto; padding:64px 24px; }
  h1 { font-size:1.5rem; margin:0 0 24px; }
  ul { padding:0; margin:0; list-style:none; }
  li { margin-bottom:12px; }
  a { color:var(--accent); font-size:1.05rem; text-decoration:none; }
  a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Stage City Apps</h1>
    <ul>
      <li><a href="https://chefkristian.github.io/aquamarine-legal/">Aquamarine — Privacy Policy &amp; Terms →</a></li>
    </ul>
  </div>
</body>
</html>
